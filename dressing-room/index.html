<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的作品集｜夢幻 3D 更衣室</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #fce7f3, #fdf2f8);
    }
  </style>
</head>
<body class="text-gray-800">

  <!-- Header -->
  <header class="max-w-6xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-extrabold text-pink-600 mb-2">
      ✨ 我的互動作品集
    </h1>
    <p class="text-gray-600 text-lg">
      使用 Three.js 製作的 3D 夢幻更衣室（可即時換裝、分享）
    </p>
  </header>

  <!-- Game Section -->
  <main class="max-w-6xl mx-auto px-6 pb-20">
    <section class="bg-white rounded-2xl shadow-2xl p-6">

      <h2 class="text-2xl font-bold text-pink-500 mb-4 flex items-center">
        🎮 夢幻 3D 更衣室
        <span class="ml-3 text-sm font-normal text-gray-500">
          （直接在頁面中遊玩）
        </span>
      </h2>

      <!-- iframe Embed -->
      <div class="relative w-full overflow-hidden rounded-xl shadow-lg">
        <iframe
          src="dressing-room/index.html"
          class="w-full"
          style="height: 850px; border: none;"
          loading="lazy"
          allowfullscreen>
        </iframe>
      </div>

      <!-- Hint -->
      <p class="mt-4 text-sm text-gray-500">
        💡 操作提示：滑鼠拖曳旋轉角色、滾輪縮放，右側面板可調整穿搭。
      </p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-400 pb-10">
    © 2025 111118025 · GitHub Pages
  </footer>

</body>
</html>
